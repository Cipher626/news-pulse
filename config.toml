# ---------------------------------------------------------------------------------------------
# Topics. These are the choices in the app's topic picker. Each needs a unique id.
#   weight   - taste. Multiplies the score of non-breaking stories: 2.0 = twice as hot, 0.5 = half.
#              This is what makes For you, Top and alerts lean toward what you care about.
#   alert_score / alert_min_outlets - optional lower notification bar for this topic
#   default  - selected in the app until you change it there
#   paths    - URL segments or RSS categories that mean this topic (/sports/, /cricket/, ...)
#   keywords - headline words; English, Hindi or Gujarati
# Add a topic by adding a block. It appears in the app on the next run.
# ---------------------------------------------------------------------------------------------

