# Pulse: personal news radar.
# Everything you are likely to tune lives in this file. Edit, commit, push:
# the next run picks it up. No code changes needed. Times are IST.

[site]
title = "Pulse"
interval_minutes = 30     # informational, shown on the page; the real schedule is in .github/workflows/news.yml
max_age_hours = 24        # stories older than this drop off
max_stories = 200         # cap on stories written to the page
hot_score = 6.0           # stories at or above this get a warm meter on the page
# Tabs in the app, in order. Allowed: foryou, latest, top, india, world, or any topic id below.
tabs = ["foryou", "tech", "latest", "world"]

[fetch]
min_sources_ok = 8        # fewer sources than this answering = outage: keep the last good page, send no alerts
failing_after_runs = 3    # a source failing this many runs in a row shows "failing since" in the footer
ignore_outlets = ["Hotelier Buzz"]   # outlets to drop entirely (junk that Google News searches pull in)
skip_url_patterns = [     # items whose link contains any of these are dropped (videos, galleries, web stories)
  "/video/", "/videos/", "/photo/", "/photos/", "/photo-gallery/", "/photogallery/", "/gallery/",
  "/web-stories/", "/webstories/", "/visualstories/", "/web-story/", "/short-videos/",
]

[alerts]
enabled = true
score = 8.0               # notify at or above this score...
min_outlets = 3           # ...and only if at least this many independent newsrooms carry it
max_per_run = 2            # with runs every 30 minutes, 2 per run avoids bursts
max_per_day = 12
cooldown_hours = 24       # the same story will not notify twice inside this window
quiet_start = "23:30"     # during quiet hours only breaking news notifies
quiet_end = "07:00"
breaking_weight = 3       # a [[sensitive]] category with at least this weight makes a story "breaking"
# Topics that may notify. Breaking news and watched keywords notify whatever their topic.
# The topic picker in the app only changes what you see, not this list.
topics = ["politics", "business", "tech", "science", "education", "defence", "environment", "gujarat"]
alert_untagged = true     # stories the topic labeller could not place may still notify

[watch]
# Specific things you care about. A matching story shows in For you whatever its topic,
# is tagged Watching, and notifies at a lower bar. Add names, companies, exams, places.
# Short all-caps words like "AI" match too much ("AI 171" is an Air India flight); prefer phrases.
keywords = ["ISRO", "semiconductor", "robotics", "machine learning", "JEE", "GATE exam"]
alert_score = 4.0
min_outlets = 2

[scoring]
# score = independent newsrooms + fresh_weight * outlets that published in the last fresh_minutes
#         + the highest sensitive-category weight matched
# Non-India stories with no sensitive tag are multiplied by global_multiplier.
fresh_minutes = 90
fresh_weight = 0.5
global_multiplier = 0.7
decay_hours = 6           # page ordering only: a story's rank halves every decay_hours

[cluster]
min_shared = 3
min_overlap = 0.45
strong_shared = 2
strong_overlap = 0.66
wire_similarity = 0.9     # near-identical headlines from different outlets count once (PTI/ANI wire copy)

[sections]
# URL segments that mark a story from a general Indian feed as world news.
world_paths = ["world", "world-news", "international", "videsh", "duniya", "global", "abroad"]

# Outlets with one owner count as one newsroom when judging how widely a story spread.
# Names must match the outlet names in [[feeds]] or the names Google News uses.
[owners]
"India Today Group" = ["India Today", "Aaj Tak", "Business Today", "The Lallantop", "AajTak"]
"Times Group" = ["Times of India", "Economic Times", "Navbharat Times", "Times Now", "Mirror Now", "ET Now"]
"HT Media" = ["Hindustan Times", "Mint", "Livemint", "Live Hindustan", "Hindustan"]
"ABP Group" = ["ABP Live", "ABP News", "ABP Majha", "ABP Ananda", "ABP Asmita"]
"India TV" = ["India TV", "India TV News", "India TV Hindi", "IndiaTV"]
"Express Group" = ["Indian Express", "Financial Express", "Jansatta"]
"The Hindu Group" = ["The Hindu", "BusinessLine", "The Hindu BusinessLine", "Frontline", "Sportstar"]
"NDTV" = ["NDTV", "NDTV India", "NDTV Profit", "NDTV Sports", "NDTV Khabar"]
"Network18" = ["News18", "News18 Hindi", "CNBC-TV18", "Moneycontrol", "Firstpost", "CNN-News18", "News18 Gujarati"]
"DB Corp" = ["Divya Bhaskar", "Dainik Bhaskar", "Bhaskar English", "DivyaBhaskar"]
"BBC" = ["BBC News", "BBC", "BBC Hindi", "BBC News Hindi", "BBC News Gujarati"]
"Zee Media" = ["Zee News", "WION", "Zee Business", "DNA India"]

# Words that make a story India-relevant even when it comes from a world feed.
[india]
keywords = [
  "india", "indian", "indians", "new delhi", "delhi", "mumbai", "bengaluru", "bangalore", "chennai",
  "kolkata", "hyderabad", "ahmedabad", "gandhinagar", "pune", "gujarat", "maharashtra", "karnataka",
  "kerala", "tamil nadu", "uttar pradesh", "bihar", "punjab", "rajasthan", "kashmir", "j&k", "ladakh",
  "assam", "manipur", "odisha", "west bengal", "modi", "rbi", "sensex", "nifty", "rupee", "isro",
  "bjp", "lok sabha", "rajya sabha", "pakistan", "bangladesh", "sri lanka", "nepal", "lac",
  "भारत", "भारतीय", "दिल्ली", "मोदी", "ભારત", "ગુજરાત",
