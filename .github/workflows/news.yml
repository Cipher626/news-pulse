name: news

on:
  schedule:
    # Every 30 minutes, offset from :00 and :30, which are GitHub's busiest (most delayed) slots.
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a test notification to your phone"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "web/**"
      - "config.toml"
      - "requirements.txt"
      - ".github/workflows/news.yml"

permissions:
  contents: write   # commit data/state.json
  pages: write      # publish the site
  id-token: write   # required by deploy-pages

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build feed and send alerts
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          SITE_URL: ${{ vars.SITE_URL }}
          TEST_ALERT: ${{ inputs.test_alert }}
          # A run caused by your own push only rebuilds the page; pings wait for the next scheduled run.
          SKIP_ALERTS: ${{ github.event_name == 'push' }}
        run: python -m pipeline.run

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit --quiet -m "state $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3; do
            git pull --rebase --quiet && git push --quiet && exit 0
            sleep 5
          done
          echo "Could not push state; the next run will rebuild it." >&2

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5
